<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누구나 바이브코딩 시작</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:ital,wght@0,400;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f4ed;
    --color-ink:    #0b0d0b;
    --color-muted:  #52534e;
    --color-soft:   #65655c;
    --color-accent: #f7591f;
    --font-sans:  'Paperlogy', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-serif: 'Noto Serif KR', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1100px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-size: 0.9rem;
    color: var(--color-muted);
    margin-bottom: 1.75rem;
  }
  svg { width: 100%; min-width: 880px; display: block; }
  .section-label {
    font-family: 'Paperlogy', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--color-ink);
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Vibe Coding · Flow</p>
    <h1>누구나 바이브코딩 시작</h1>
    <p class="subtitle">비개발자가 환경 준비부터 개발까지 가는 흐름</p>

    <p class="section-label">전체 흐름 · 환경 준비에서 배포까지</p>
    <svg viewBox="0 0 960 840" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(11,13,11,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#52534e"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f7591f"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a70c7"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f4ed"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ===== 화살표 (박스보다 먼저) ===== -->
      <line x1="260" y1="172" x2="308" y2="172" stroke="#52534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="172" x2="656" y2="172" stroke="#52534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="224" x2="776" y2="264" stroke="#52534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="352" x2="776" y2="384" stroke="#52534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="472" x2="776" y2="504" stroke="#52534e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="592" x2="776" y2="624" stroke="#f7591f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ===== Callout A — 코드는 몰라도 된다 (입구 메시지 → 주제 선정) ===== -->
      <text x="458" y="40" fill="#f7591f" font-size="14" font-style="italic"
            font-family="'Noto Serif KR', serif" text-anchor="middle">코드는 몰라도 된다 —</text>
      <text x="458" y="60" fill="#f7591f" font-size="14" font-style="italic"
            font-family="'Noto Serif KR', serif" text-anchor="middle">업무를 아는 게 진짜 실력이니까</text>
      <path d="M 458 66 Q 480 95 458 120" fill="none"
            stroke="rgba(247,89,31,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="458" cy="120" r="2.5" fill="#f7591f"/>

      <!-- ===== Callout B — 시중 툴은 못 따라온다 (→ 개발) ===== -->
      <text x="776" y="40" fill="#f7591f" font-size="14" font-style="italic"
            font-family="'Noto Serif KR', serif" text-anchor="middle">시중 툴은 못 따라온다 —</text>
      <text x="776" y="60" fill="#f7591f" font-size="14" font-style="italic"
            font-family="'Noto Serif KR', serif" text-anchor="middle">나의 업무에 나의 것을 만들어 사용한다</text>
      <path d="M 776 66 Q 800 95 776 120" fill="none"
            stroke="rgba(247,89,31,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="776" cy="120" r="2.5" fill="#f7591f"/>

      <!-- ===== N1 — 환경 준비 (start / oval) ===== -->
      <rect x="40" y="120" width="220" height="104" rx="52" fill="#f5f4ed"/>
      <rect x="40" y="120" width="220" height="104" rx="52" fill="rgba(82,83,78,0.08)" stroke="#65655c" stroke-width="1"/>
      <rect x="58" y="132" width="52" height="14" rx="2" fill="transparent" stroke="rgba(101,101,92,0.45)" stroke-width="0.8"/>
      <text x="84" y="142" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
      <text x="150" y="168" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">환경 준비</text>
      <text x="150" y="192" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">VS Code × Claude Code</text>

      <!-- ===== N2 — 주제 선정 (주제 / 형태 칩 포함) ===== -->
      <rect x="308" y="120" width="300" height="132" rx="8" fill="#f5f4ed"/>
      <rect x="308" y="120" width="300" height="132" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <rect x="324" y="132" width="52" height="14" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
      <text x="350" y="142" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOPIC</text>
      <text x="458" y="168" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">주제 선정</text>
      <text x="458" y="188" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">(무엇을 만들 것인가)</text>

      <rect x="324" y="204" width="128" height="32" rx="6" fill="rgba(11,13,11,0.04)" stroke="rgba(11,13,11,0.20)" stroke-width="1"/>
      <text x="388" y="224" fill="#0b0d0b" font-size="10" font-weight="600" font-family="'Paperlogy', sans-serif" text-anchor="middle">주제 · 업무 자동화</text>

      <rect x="464" y="204" width="128" height="32" rx="6" fill="rgba(11,13,11,0.04)" stroke="rgba(11,13,11,0.20)" stroke-width="1"/>
      <text x="528" y="224" fill="#0b0d0b" font-size="10" font-weight="600" font-family="'Paperlogy', sans-serif" text-anchor="middle">형태 · 앱 / 웹</text>

      <!-- ===== N3 — 개발 (헤더, 아래로 세부 흐름이 바로 이어짐) ===== -->
      <rect x="656" y="120" width="240" height="104" rx="8" fill="#f5f4ed"/>
      <rect x="656" y="120" width="240" height="104" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <rect x="672" y="132" width="50" height="14" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
      <text x="697" y="142" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
      <text x="776" y="168" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">개발</text>
      <text x="776" y="192" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">(만들기)</text>

      <!-- ===== N4 — 기획 (개발 바로 하부) ===== -->
      <rect x="656" y="264" width="240" height="88" rx="8" fill="#f5f4ed"/>
      <rect x="656" y="264" width="240" height="88" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <rect x="672" y="276" width="44" height="14" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
      <text x="694" y="286" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="776" y="304" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">기획</text>
      <text x="776" y="328" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">만들 기능 정의하기</text>

      <!-- ===== N5 — 화면 ===== -->
      <rect x="656" y="384" width="240" height="88" rx="8" fill="#f5f4ed"/>
      <rect x="656" y="384" width="240" height="88" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <rect x="672" y="396" width="36" height="14" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
      <text x="690" y="406" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="776" y="424" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">화면</text>
      <text x="776" y="448" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">화면 구조 그려보기</text>

      <!-- ===== N6 — 데이터 ===== -->
      <rect x="656" y="504" width="240" height="88" rx="8" fill="#f5f4ed"/>
      <rect x="656" y="504" width="240" height="88" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <rect x="672" y="516" width="44" height="14" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
      <text x="694" y="526" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="776" y="544" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">데이터</text>
      <text x="776" y="568" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">저장할 정보 정리하기</text>

      <!-- ===== N7 — 배포 (focal / happy-path landing) ===== -->
      <rect x="656" y="624" width="240" height="88" rx="8" fill="#f5f4ed"/>
      <rect x="656" y="624" width="240" height="88" rx="8" fill="rgba(247,89,31,0.07)" stroke="#f7591f" stroke-width="1.2"/>
      <rect x="672" y="636" width="44" height="14" rx="2" fill="transparent" stroke="rgba(247,89,31,0.50)" stroke-width="0.8"/>
      <text x="694" y="646" fill="#f7591f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHIP</text>
      <text x="776" y="664" fill="#0b0d0b" font-size="14" font-weight="700" font-family="'Paperlogy', sans-serif" text-anchor="middle">배포</text>
      <text x="776" y="688" fill="#52534e" font-size="10" font-family="'Paperlogy', sans-serif" text-anchor="middle">링크로 세상에 공유하기</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="752" x2="920" y2="752" stroke="rgba(11,13,11,0.12)" stroke-width="0.8"/>
      <text x="40" y="768" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="784" width="28" height="14" rx="7" fill="rgba(82,83,78,0.08)" stroke="#65655c" stroke-width="1"/>
      <text x="76" y="795" fill="#52534e" font-size="9" font-family="'Paperlogy', sans-serif">시작 (oval)</text>

      <rect x="180" y="784" width="28" height="14" rx="2" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
      <text x="216" y="795" fill="#52534e" font-size="9" font-family="'Paperlogy', sans-serif">진행 단계</text>

      <rect x="320" y="784" width="28" height="14" rx="6" fill="rgba(11,13,11,0.04)" stroke="rgba(11,13,11,0.20)" stroke-width="1"/>
      <text x="356" y="795" fill="#52534e" font-size="9" font-family="'Paperlogy', sans-serif">선택 항목 (칩)</text>

      <rect x="500" y="784" width="28" height="14" rx="2" fill="rgba(247,89,31,0.07)" stroke="#f7591f" stroke-width="1"/>
      <text x="536" y="795" fill="#52534e" font-size="9" font-family="'Paperlogy', sans-serif">완성 단계</text>

      <line x1="640" y1="791" x2="668" y2="791" stroke="rgba(247,89,31,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="668" cy="791" r="2.5" fill="#f7591f"/>
      <text x="680" y="795" fill="#52534e" font-size="9" font-family="'Paperlogy', sans-serif">핵심 메시지</text>
    </svg>
  </div>
</body>
</html>
